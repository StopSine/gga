# N64Recomp config for Goemon's Great Adventure (USA).
#
# Symbols come from the linked ELF via --dump-context (see gga.dump_context.toml),
# so overlay sections carry relocations. Paths resolve relative to this file.

[input]
entrypoint = 0x80000400
# Relative to this file: lib/gga/config/usa -> the repository root.
output_func_path = "../../../../RecompiledFuncs"
symbols_file_path = "gga.elf.syms.toml"
rom_file_path = "baserom.decompressed.z64"
relocatable_sections_path = "gga.overlays.txt"
bss_section_suffix = "_bss"

[patches]
# Tracked debt, each to become runtime interception or real code:
#  - libultra routines N64Recomp does not model: COP0 registers other than
#    Status, and the cache instruction
#  - a call into 0x8400103C (RSP IMEM), still unmapped
# Mapping file 5 removed three stubs whose only problem was calling into it.
#  - two jump tables N64Recomp cannot size
stubs = [
    # Reads the PI domain-1 config registers (PI_BSD_DOM1_LAT/PWD/PGS/RLS at
    # 0xA4600014..0x20). MMIO is not modelled, so N64Recomp lowers these to
    # RDRAM accesses far outside the 8 MB buffer and the process faults. The
    # runtime owns the PI, so the read is vestigial.
    "func_800189FC_195FC",
    "func_8000FD50_10950",
    "func_800104D4_110D4",
    "func_80024478_25078",
    "func_8002549C_2609C",
    "func_80025A00_26600",
    "func_80024470_25070",
    "func_800E9E5C_5A507C",
    "func_80013D80_14980",
    "func_8001C050_1CC50",
    "func_8001E860_1F460",
    # Video interface initialisation (0x8001C8C0). Zeroes a VI context via
    # bzero, then reads VI_CURRENT_REG at 0xA4400010 and programs the VI.
    # Same problem as the PI reads above: MMIO is lowered to an RDRAM access
    # far outside the 8 MB buffer, so it faults. RT64 owns video output, so
    # the game programming the VI itself is vestigial.
    #
    # Naming it does not help. The runtime has no __osViInit implementation,
    # and the plain osViInit spelling is in neither reimplemented_funcs nor
    # ignored_funcs, so it would be recompiled as real code and fault anyway.
]

ignored = []
