# For N64Recomp's --dump-context flag: reads the linked ELF and writes
# dump.toml / data_dump.toml (hardcoded names, emitted into the CWD).
# Paths resolve relative to this file's directory.

[input]
entrypoint = 0x80000400
output_func_path = "../../build/usa/dump_context_out"
elf_path = "../../build/usa/gga.elf"
relocatable_sections_path = "gga.overlays.txt"
bss_section_suffix = "_bss"

[patches]
stubs = []
ignored = []
