name: "Goemon's Great Adventure (USA)"
sha1: 0ecc6ddcdc3bc02882ac88409188f7919e1cceac

options:
  basename: gga
  compiler: IDO
  platform: n64

  header_encoding: ASCII

  target_path: config/usa/baserom.decompressed.z64
  ld_script_path: .splat/usa/gga.ld
  elf_path: build/usa/gga.elf
  base_path: ../../

  undefined_funcs_auto_path: .splat/usa/undefined_funcs_auto.ld
  undefined_syms_auto_path: .splat/usa/undefined_syms_auto.ld

  symbol_addrs_path:
    - config/usa/symbol_addrs/symbol_addrs.txt

  asm_path: asm/usa
  src_path: src
  build_path: build/usa
  asset_path: bin/usa

  symbol_name_format: $VRAM_$ROM

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  rodata_string_guesser_level: 2
  gfx_ucode: f3dex

  # Emit an ELF suitable for dumping N64Recomp symbols rather than a matching build.
  asm_nonmatching_label_macro: ""

# Resident image only for this first pass. ROM 0x1000 -> VRAM 0x80000400
# (i.e. rom = vram - 0x7FFFF400), derived from the N64 header's boot address.
# Code runs to ~0x26628 (last `jr $ra`); RSP microcode and data follow.
# The 2577-entry Nisitenma-Ichigo file table lives at 0x2C794; files start at 0x582530.
segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    subalign: 16
    subsegments:
      - [0x1000, hasm, entry]

  - name: main
    type: code
    start: 0x1050
    vram: 0x80000450
    subalign: 16
    subsegments:
      - [0x1050, asm, main]

  # Everything after the resident image. Segments come from the engine's own
  # per-file load table at VRAM 0x80026B00 (see docs/overlay_loader.md):
  # vram_start 0x08000000 is a relocatable overlay, anything else a fixed
  # window. Files sharing a window are mutually exclusive and share a ram id.
  # Conservative code/data boundary: the last `jr $ra`, which keeps jump
  # tables (whose entries decode as `j` to addresses outside the file) inside
  # the data subsegment.
  - name: gap_0
    type: bin
    start: 0x26630

  # File 5: loaded to a fixed window at 0x800C7B10.
  # Load window from the table at 0x27700.
  - name: file_5
    type: code
    start: 0x582D30
    vram: 0x800C7B10
    subalign: 16
    overlay: yes
    exclusive_ram_id: win_800C7B10
    subsegments:
      - [0x582D30, asm, file_5]
      - [0x5B58D0, data, file_5_data]

  # File 7: loaded to a fixed window at 0x801738A0.
  # Load window from the table at 0x27700.
  - name: file_7
    type: code
    start: 0x5CAEE0
    vram: 0x801738A0
    subalign: 16
    overlay: yes
    exclusive_ram_id: win_801738A0
    subsegments:
      - [0x5CAEE0, asm, file_7]
      - [0x5CD2B0, data, file_7_data]

  # File 8: loaded to a fixed window at 0x801738A0.
  # Load window from the table at 0x27700.
  - name: file_8
    type: code
    start: 0x5D6300
    vram: 0x801738A0
    subalign: 16
    overlay: yes
    exclusive_ram_id: win_801738A0
    subsegments:
      - [0x5D6300, asm, file_8]
